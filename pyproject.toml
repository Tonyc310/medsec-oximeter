# Checks for the Python in tools/ and fuzz/: PEP 8 and PEP 257 through ruff, at the C code's 100
# columns; mypy in strict mode; pytest.
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "D"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

# A test's name says what it checks.
[tool.ruff.lint.per-file-ignores]
"tools/tests/*" = ["D103"]

[tool.mypy]
strict = true
files = ["tools", "fuzz"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]
pythonpath = ["tools"]
