CONFIG_STD_C17=y
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y
CONFIG_LOG=y

# The real oximeter's Bluetooth settings (app/prj.conf), but for privacy and bonds, which it doesn't
# need: Renode gives it an address of its own.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="medsec-oximeter"
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048
