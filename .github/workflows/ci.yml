name: CI

on:
  push:
  pull_request:
  # Weekly, for the vulnerability check: CVEs published since the last build.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Check formatting
        run: git ls-files '*.[ch]' | xargs pipx run clang-format==23.1.2 --dry-run --Werror

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the checks
        run: pip install ruff==0.17.2 mypy==2.4.0 pytest==9.1.1 pyyaml==6.0.3 types-PyYAML

      # PEP 8 and PEP 257, per pyproject.toml.
      - name: ruff
        run: |
          ruff check tools fuzz
          ruff format --check tools fuzz

      - name: mypy
        run: mypy

      - name: pytest
        run: pytest

  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-tidy cppcheck

      - name: Unit tests (sanitized)
        run: cmake --workflow --preset host

      # CERT C checks, the static analyzer and bug-prone patterns, per .clang-tidy.
      - name: clang-tidy
        run: clang-tidy -p build/host core/src/*.c

      - name: cppcheck
        run: >-
          cppcheck --std=c11 --enable=warning,style,performance,portability --inline-suppr
          --error-exitcode=1 -q -I core/include core/src

  # libFuzzer on core/'s parsers of what other devices send, a minute each. Each run starts from
  # nothing: the inputs are a few bytes long, so the fuzzer finds their shape within seconds.
  fuzz:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build the fuzz targets
        run: CC=clang cmake --workflow --preset fuzz

      - name: Fuzz
        run: |
          mkdir -p build/fuzz/crashes
          for target in build/fuzz/fuzz/fuzz_*; do
            "$target" -max_total_time=60 -artifact_prefix=build/fuzz/crashes/
          done

      - name: Upload the inputs that failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crashes
          path: build/fuzz/crashes/

  firmware:
    runs-on: ubuntu-24.04
    env:
      RENODE_VERSION: 1.17.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Fetches the Zephyr tree pinned in app/west.yml and the SDK version it names.
      - name: Set up Zephyr
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          app-path: app
          toolchains: arm-zephyr-eabi

      # imgtool signs the oximeter as it's built, and the images the Renode boot tests make.
      - name: Install imgtool's requirements
        run: pip install -r deps/bootloader/mcuboot/scripts/requirements.txt

      # Tests of code that needs Zephyr, run as Linux programs (native_sim): no board needed. Simulated
      # flash stays in memory, erased at each start, rather than in a file.
      - name: Tests on native_sim
        run: |
          west build -b native_sim/native/64 -d build/limits_crypto app/tests/limits_crypto
          build/limits_crypto/zephyr/zephyr.exe
          west build -b native_sim/native/64 -d build/limits_signer hub/tests/limits_signer
          build/limits_signer/zephyr/zephyr.exe
          west build -b native_sim/native/64 -d build/limits_store app/tests/limits_store
          build/limits_store/zephyr/zephyr.exe -flash_in_ram
          west build -b native_sim/native/64 -d build/event_log app/tests/event_log
          build/event_log/zephyr/zephyr.exe -flash_in_ram
          west build -b native_sim/native/64 -d build/pairing_seal common/tests/pairing_seal
          build/pairing_seal/zephyr/zephyr.exe

      # The update protocol as a hostile gateway could send it, under libFuzzer for a minute: the
      # running image's slot never changes (fuzz/smp). Built with clang; UBSan stops at anything but
      # the two reports fuzz/smp/ubsan.supp explains.
      - name: Fuzz the update protocol
        env:
          ZEPHYR_TOOLCHAIN_VARIANT: host/llvm
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:suppressions=fuzz/smp/ubsan.supp
        run: |
          west build -b native_sim/native/64 -d build/smp_fuzz fuzz/smp
          python3 fuzz/smp/seeds.py build/smp_fuzz/seeds
          mkdir -p build/smp_fuzz/corpus build/smp_fuzz/crashes
          build/smp_fuzz/zephyr/zephyr.exe build/smp_fuzz/corpus build/smp_fuzz/seeds \
            -dict=fuzz/smp/smp.dict -max_total_time=60 -artifact_prefix=build/smp_fuzz/crashes/

      - name: Upload the update-protocol inputs that failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smp-fuzz-crashes
          path: build/smp_fuzz/crashes/

      # Another hub, with a signing master of its own: a gateway the backend let pair but won't sign
      # for. Zephyr's Bluetooth shell plays a phone, keeping no bonds since Renode's board for it has
      # no flash controller. Zephyr's flash driver tests, on the internal flash, check the flash
      # controller model.
      - name: Build the firmware
        run: |
          west build --sysbuild -b nrf52840dk/nrf52840 -d build/oximeter app
          west build -b nrf52840dk/nrf52840 -d build/hub hub
          west build -b nrf52840dk/nrf52840 -d build/hub-other-key hub -- \
            -DSIGNING_MASTER_FILE=$PWD/build/other-signing-master.key
          west build -b nrf52840dk/nrf52840 -d build/phone deps/zephyr/tests/bluetooth/shell -- \
            -DCONFIG_BT_SETTINGS=n
          west build -b nrf52840dk/nrf52840 -d build/flash-test deps/zephyr/tests/drivers/flash/common \
            -- -DCONFIG_TEST_FORCE_STORAGE_PARTITION=y

      # From what each image compiled (west spdx), with docs/security/components.yaml's versions,
      # identifiers and support: the SBOM of this exact build.
      - name: SBOM
        run: |
          west spdx --analyze-includes -d build/oximeter/app
          west spdx --analyze-includes -d build/oximeter/mcuboot
          python3 tools/sbom.py --components docs/security/components.yaml --version-file app/VERSION \
            --image app=build/oximeter/app/spdx --image mcuboot=build/oximeter/mcuboot/spdx \
            --output build/medsec-oximeter.cdx.json

      - name: Upload the SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: |
            build/medsec-oximeter.cdx.json
            build/oximeter/app/spdx/
            build/oximeter/mcuboot/spdx/

      - name: Install Renode
        run: |
          curl -fsSL "https://github.com/renode/renode/releases/download/v${RENODE_VERSION}/renode-${RENODE_VERSION}.linux-portable.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          renode_dir="$RUNNER_TEMP/renode_${RENODE_VERSION}-portable"
          pip install -r "$renode_dir/tests/requirements.txt"
          echo "$renode_dir" >> "$GITHUB_PATH"

      # renode-test writes its report to the working directory, so run it inside the build tree.
      - name: Renode tests
        run: |
          mkdir -p build/renode && cd build/renode
          renode-test ../../renode/oximeter.robot ../../renode/boot.robot ../../renode/flash.robot \
            ../../renode/ccm.robot ../../renode/radio.robot ../../renode/sensor.robot

      - name: Upload Renode results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: renode-results
          path: build/renode/

  # Each CVE NVD lists for this build's SBOM needs a disposition in
  # docs/security/vulnerabilities.md. Weekly and on demand only, since new CVEs arrive whether or
  # not the code changes.
  vulnerabilities:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: firmware
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: sbom
          path: build

      - name: Check every vulnerability has a disposition
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          python3 tools/vulns.py --sbom build/medsec-oximeter.cdx.json
          --assessment docs/security/vulnerabilities.md
