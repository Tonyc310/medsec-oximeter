# Added to MCUboot's own configuration. MCUboot refuses an update whose security counter is below
# the running image's, and erases it.
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=y
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION_SECURITY_COUNTER=y
# The build's metadata, which west spdx reads for the SBOM (tools/sbom.py).
CONFIG_BUILD_OUTPUT_META=y
