CONFIG_STD_C17=y
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y
# The SpO2 ratio and the pulse period are single-precision floats.
CONFIG_FPU=y

CONFIG_LOG=y

CONFIG_SENSOR=y
# The sample callback sends BLE notifications, which must not run on the system work queue: the
# Bluetooth stack can need that queue to free the very buffers a notification waits for.
CONFIG_MAX30101_TRIGGER_OWN_THREAD=y
CONFIG_MAX30101_THREAD_SIZE=2048

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="medsec-oximeter"
# Pairs by LE Secure Connections only, authenticated with its sealed out-of-band data
# (src/pairing.c): security level 4 or nothing.
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
# Keeps the bond in flash, with the settings, so a reset doesn't mean pairing again. Zephyr writes
# it from the system work queue, whose default stack a settings write overflows.
CONFIG_BT_SETTINGS=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# The hub starts encryption itself on every reconnection, so the oximeter doesn't also ask for it:
# with both starting it at once, the reconnection stalled in simulation.
CONFIG_BT_GATT_AUTO_SEC_REQ=n

# A signed limits change is 21 bytes, more than the 20 a default-sized write carries.
CONFIG_BT_BUF_ACL_RX_SIZE=69
CONFIG_BT_L2CAP_TX_MTU=65
# Data Length Extension: a whole ATT payload, such as a signed limits change, travels in one
# link-layer packet rather than several. Renode's radio model also needs it on an encrypted link: it
# delivers a packet that arrives while the receiver is still turning around one connection event
# late, and the link never catches up.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=69
CONFIG_BT_BUF_ACL_TX_SIZE=69
# PSA Crypto starts on the main thread, and the HMAC check runs on the Bluetooth receive thread.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048

# Resets the oximeter if it stops running (app/src/supervisor.c).
CONFIG_WATCHDOG=y

# The reset cause, for the security event log's start-up records.
CONFIG_HWINFO=y

# Reads the signed header of the running image, for its version, and marks an update as working.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y

# The release's security counter, in its signed header. Only a release that fixes a vulnerability
# raises it, and MCUboot then refuses every release before it.
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--security-counter 1"
