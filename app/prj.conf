CONFIG_STD_C17=y
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y
# The SpO2 ratio and the pulse period are single-precision floats.
CONFIG_FPU=y

CONFIG_LOG=y

CONFIG_SENSOR=y
# The sample callback sends BLE notifications, which must not run on the system work queue: the
# Bluetooth stack can need that queue to free the very buffers a notification waits for.
CONFIG_MAX30101_TRIGGER_OWN_THREAD=y
CONFIG_MAX30101_THREAD_SIZE=2048

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="medsec-oximeter"
# Pairs by LE Secure Connections only, authenticated with its sealed out-of-band data
# (src/pairing.c): security level 4 or nothing.
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
# Keeps the bond in flash, with the settings, so a reset doesn't mean pairing again. Zephyr writes
# it from the system work queue, whose default stack a settings write overflows.
CONFIG_BT_SETTINGS=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# The hub starts encryption itself on every reconnection, so the oximeter doesn't also ask for it:
# with both starting it at once, the reconnection stalled in simulation.
CONFIG_BT_GATT_AUTO_SEC_REQ=n
# One bond, with the gateway. Pairing needs the backend's sealed data, so a new pairing is one the
# backend authorized, a replacement gateway, and it takes the old one's place.
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
# The gateway sets the link's timing: a fast interval while it sends an update, a short supervision
# timeout so it soon notices a silent oximeter. The oximeter still publishes its preferences, but no
# longer asks for them 5 s into a link, which undid a fast interval mid-update.
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n

# Button 1's long press, which resets the oximeter for a new patient (src/new_patient.c).
CONFIG_INPUT=y

# A 247-byte ATT MTU: an update arrives in big pieces, and a signed limits change (21 bytes) in one
# write. It's the largest that still fits one 251-byte link-layer packet.
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
# Data Length Extension: a whole ATT payload, such as a signed limits change, travels in one
# link-layer packet rather than several. Renode's radio model also needs it on an encrypted link: it
# delivers a packet that arrives while the receiver is still turning around one connection event
# late, and the link never catches up.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# PSA Crypto starts on the main thread, and the HMAC check runs on the Bluetooth receive thread.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048

# Resets the oximeter if it stops running (app/src/supervisor.c).
CONFIG_WATCHDOG=y

# The reset cause, for the security event log's start-up records.
CONFIG_HWINFO=y

# Reads the signed header of the running image, for its version, and marks an update as working.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y

# The release's security counter, in its signed header. Only a release that fixes a vulnerability
# raises it, and MCUboot then refuses every release before it.
CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS="--security-counter 1"

# Updates over Bluetooth: MCUmgr's SMP server, with only what an update needs: image upload and
# state, and a reset. Zephyr allows SMP only over an authenticated link
# (MCUMGR_TRANSPORT_BT_PERM_RW_AUTHEN, its default once pairing is on).
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_BT=y
# A request longer than one ATT write comes in pieces.
CONFIG_MCUMGR_TRANSPORT_BT_REASSEMBLY=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=n
# The gateway marks an update for a test boot and nothing more; only the oximeter's self-test keeps
# it. It can't confirm an image that isn't running, and src/update_guard.c refuses any image-state
# change while an update is on trial.
CONFIG_MCUMGR_GRP_IMG_ALLOW_CONFIRM_NON_ACTIVE_SLOT=n
CONFIG_MCUMGR_GRP_IMG_ALLOW_CONFIRM_NON_ACTIVE_IMAGE_SECONDARY=n
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
# MCUboot's library logs each slot's state every time it's asked, many times a second during an
# upload; only its warnings are news.
CONFIG_MCUBOOT_UTIL_LOG_LEVEL_WRN=y

# The build's metadata, which west spdx reads for the SBOM (tools/sbom.py).
CONFIG_BUILD_OUTPUT_META=y
