# PSA Crypto for signed alarm-limit changes: HMAC-SHA256, and random challenges. The firmware and
# app/tests/limits_crypto both use this file, so the tests check the configuration that ships.
CONFIG_PSA_CRYPTO=y
# Key material in fixed slots rather than on a heap.
CONFIG_MBEDTLS_PSA_STATIC_KEY_SLOTS=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_ENTROPY_GENERATOR=y
