# MCUboot checks the oximeter's signature at every boot (docs/security/updatability.md). Swap using
# offset keeps the previous image until a new one has proved it works.
SB_CONFIG_BOOTLOADER_MCUBOOT=y
SB_CONFIG_BOOT_SIGNATURE_TYPE_ECDSA_P256=y
SB_CONFIG_MCUBOOT_MODE_SWAP_USING_OFFSET=y
# Made by app/sysbuild.cmake. Each image expands the path itself.
SB_CONFIG_BOOT_SIGNATURE_KEY_FILE="${WEST_TOPDIR}/build/release-key.pem"
