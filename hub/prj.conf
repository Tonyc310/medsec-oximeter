CONFIG_STD_C17=y
CONFIG_COMPILER_WARNINGS_AS_ERRORS=y

CONFIG_LOG=y
# Log through the shell, which owns the console.
CONFIG_SHELL=y
CONFIG_LOG_BACKEND_UART=n

CONFIG_BT=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
# Lets a subscription find the characteristic's notification switch (its CCC descriptor) itself.
CONFIG_BT_GATT_AUTO_DISCOVER_CCC=y

# A 247-byte ATT MTU, which the hub asks for as soon as it connects: an update goes in big pieces,
# and a signed limits change (21 bytes) in one write. It's the largest that still fits one 251-byte
# link-layer packet.
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_GATT_AUTO_UPDATE_MTU=y
# Data Length Extension: a whole ATT payload, such as a signed limits change, travels in one
# link-layer packet rather than several. Renode's radio model also needs it on an encrypted link: it
# delivers a packet that arrives while the receiver is still turning around one connection event
# late, and the link never catches up.
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
# PSA Crypto starts on the main thread, and signing runs on the Bluetooth receive thread.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048

# Pairs by LE Secure Connections only, with the oximeter's out-of-band data (src/pairing.c), and
# keeps the bond. Only in RAM here: the gateway it stands in for would keep it in flash.
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y

# Sends the oximeter its updates over SMP (src/update.c), with Zephyr's own client for the image
# and reset commands, which reads MCUboot's image format with MCUboot's utility library.
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUBOOT_BOOTUTIL_LIB=y
CONFIG_MCUMGR=y
CONFIG_SMP_CLIENT=y
CONFIG_MCUMGR_GRP_IMG_CLIENT=y
CONFIG_MCUMGR_GRP_OS_CLIENT=y
CONFIG_MCUMGR_GRP_OS_CLIENT_RESET=y
