# libFuzzer, with AddressSanitizer and UndefinedBehaviorSanitizer: clang only.
CONFIG_ARCH_POSIX_LIBFUZZER=y
CONFIG_ASAN=y
CONFIG_UBSAN=y
# Below the Bluetooth host's threads, which then handle each packet as soon as it arrives.
CONFIG_MAIN_THREAD_PRIORITY=14
CONFIG_LOG=n

# The Bluetooth host as the oximeter configures it (app/prj.conf), over a controller the fuzzer
# plays (src/hci_fuzz.c). Bonds stay in RAM: native_sim has no settings to keep them in.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="medsec-oximeter"
CONFIG_BT_PRIVACY=y
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_ONLY=y
CONFIG_BT_GATT_AUTO_SEC_REQ=n
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y
CONFIG_BT_MAX_CONN=2
CONFIG_BT_FILTER_ACCEPT_LIST=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_GATT_CACHING=n
CONFIG_BT_GATT_READ_MULTIPLE=n
CONFIG_BT_GATT_READ_MULT_VAR_LEN=n
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
