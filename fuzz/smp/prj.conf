# libFuzzer, with AddressSanitizer and UndefinedBehaviorSanitizer: clang only.
CONFIG_ARCH_POSIX_LIBFUZZER=y
CONFIG_ASAN=y
CONFIG_UBSAN=y
# Below MCUmgr's work queue, which then handles each request as soon as it's complete.
CONFIG_MAIN_THREAD_PRIORITY=5
CONFIG_LOG=n

# The oximeter's MCUmgr, as in app/prj.conf, over native_sim's simulated flash. MCUboot's swap mode
# can't be chosen without Zephyr's MCUboot support, which needs a code partition, so slot trailers
# take the library's default layout.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
# Where native_sim's slot 0 starts.
CONFIG_FLASH_LOAD_OFFSET=0xc000
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_IMG=y
CONFIG_MCUMGR_GRP_OS=y
CONFIG_MCUMGR_GRP_OS_ECHO=n
CONFIG_MCUMGR_GRP_IMG_ALLOW_CONFIRM_NON_ACTIVE_SLOT=n
CONFIG_MCUMGR_GRP_IMG_ALLOW_CONFIRM_NON_ACTIVE_IMAGE_SECONDARY=n
CONFIG_MCUMGR_MGMT_NOTIFICATION_HOOKS=y
CONFIG_MCUMGR_SMP_COMMAND_STATUS_HOOKS=y
# So the harness can refuse a reset, which would end the fuzzer.
CONFIG_MCUMGR_GRP_OS_RESET_HOOK=y
